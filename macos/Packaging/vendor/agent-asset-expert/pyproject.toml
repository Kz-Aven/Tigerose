[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-asset-expert"
version = "0.1.0"
description = "Local execution data assets and read-only MCP for macOS agents"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Agent Asset Expert contributors"}]

[project.scripts]
agent-asset-expert = "agent_asset_expert.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
